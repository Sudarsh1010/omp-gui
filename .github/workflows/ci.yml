name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Protocol smoke suite (ADR-0008)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Gates the live-model cycles in platform/ipc/src/session/smoke.test.ts
      # (prompt round trip, steer, abort, host-tool cycle, extension-ui
      # cycle, subagent frames). Without this secret configured on the repo,
      # those tests are skipped and only framing/negotiation still runs.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned omp binary
        run: node scripts/fetch-omp.mjs

      - name: tsc + protocol smoke suite
        run: pnpm run smoke

  bindings:
    name: Specta bindings drift + shell crate (ADR-0010)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate specta bindings
        run: pnpm run typegen

      - name: Fail on checked-in bindings drift (ADR-0010)
        run: git diff --exit-code platform/ipc/src/bindings/bindings.gen.ts

      - name: gui typecheck
        run: pnpm --filter gui exec tsc --noEmit

      - name: Fetch pinned omp binary (smoke.rs tests run it)
        run: node scripts/fetch-omp.mjs

      - name: cargo test (shell crate)
        run: cargo test -p shell
