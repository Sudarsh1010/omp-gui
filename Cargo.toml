[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
uuid = { version = "1", features = ["v4"] }
# Browser Pane (ADR-0006, ADR-0007): a dedicated tokio runtime drives the
# app's second CDP client (screencast attach) and the localhost frame server.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# Decodes `Page.screencastFrame`'s base64 JPEG payload.
base64 = "0.22"
# Cheaply-cloneable frame payloads shared across every connected pane client.
bytes = "1"

# Profiles only take effect at the workspace root. See the optimization
# guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
